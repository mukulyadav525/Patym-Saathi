<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#4A5B73"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#12A150"/>
    </marker>
  </defs>
  <rect width="1600" height="1180" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="800" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#002E6E">Pay<tspan fill="#00B9F1">tm</tspan> Saathi: how it works</text>
  <text x="800" y="84" text-anchor="middle" font-size="17" fill="#4A5B73">The shopkeeper speaks; Saathi keeps the books, plans purchases and answers from the shop's own data. Nothing is ordered or paid without approval.</text>

  <!-- Row 1: inputs -->
  <g font-size="16">
    <rect x="80" y="120" width="420" height="96" rx="14" fill="#E5F7FD" stroke="#00B9F1"/>
    <text x="290" y="156" text-anchor="middle" font-size="19" font-weight="700" fill="#002E6E">Shopkeeper speaks to the Soundbox</text>
    <text x="290" y="184" text-anchor="middle" fill="#0B1B33">"Saathi, Garv ne 5 kilo atta khareeda"</text>
    <text x="290" y="204" text-anchor="middle" font-size="14" fill="#4A5B73">iPad Soundbox page · Paytm Business app (Hey Saathi)</text>

    <rect x="590" y="120" width="420" height="96" rx="14" fill="#E5F7FD" stroke="#00B9F1"/>
    <text x="800" y="156" text-anchor="middle" font-size="19" font-weight="700" fill="#002E6E">Customer scans the Paytm QR</text>
    <text x="800" y="184" text-anchor="middle" fill="#0B1B33">Pays the bill amount (UPI)</text>
    <text x="800" y="204" text-anchor="middle" font-size="14" fill="#4A5B73">Shop QR or the bill's own QR</text>

    <rect x="1100" y="120" width="420" height="96" rx="14" fill="#E5F7FD" stroke="#00B9F1"/>
    <text x="1310" y="156" text-anchor="middle" font-size="19" font-weight="700" fill="#002E6E">Owner uses the app or dashboard</text>
    <text x="1310" y="184" text-anchor="middle" fill="#0B1B33">Types or taps; photo of a supplier bill</text>
    <text x="1310" y="204" text-anchor="middle" font-size="14" fill="#4A5B73">Android app · web dashboard</text>
  </g>

  <!-- Row 2: understanding pipeline -->
  <g font-size="15">
    <rect x="80" y="270" width="300" height="84" rx="12" fill="#EFEDFD" stroke="#6B5CE7"/>
    <text x="230" y="303" text-anchor="middle" font-size="17" font-weight="700" fill="#3C3489">1. Speech to text</text>
    <text x="230" y="328" text-anchor="middle" fill="#534AB7">Sarvam Saaras v3 (Hinglish)</text>

    <rect x="420" y="270" width="300" height="84" rx="12" fill="#EFEDFD" stroke="#6B5CE7"/>
    <text x="570" y="303" text-anchor="middle" font-size="17" font-weight="700" fill="#3C3489">2. Wake word "Saathi"?</text>
    <text x="570" y="328" text-anchor="middle" fill="#534AB7">Shop chatter is ignored</text>

    <rect x="760" y="270" width="300" height="84" rx="12" fill="#EFEDFD" stroke="#6B5CE7"/>
    <text x="910" y="303" text-anchor="middle" font-size="17" font-weight="700" fill="#3C3489">3. Understand the request</text>
    <text x="910" y="328" text-anchor="middle" fill="#534AB7">Sarvam-105B LLM → structured JSON</text>

    <rect x="1100" y="270" width="420" height="84" rx="12" fill="#EFEDFD" stroke="#6B5CE7"/>
    <text x="1310" y="303" text-anchor="middle" font-size="17" font-weight="700" fill="#3C3489">4. Check against real records</text>
    <text x="1310" y="328" text-anchor="middle" fill="#534AB7">Catalog prices · khata names · spoken amounts</text>
  </g>
  <line x1="290" y1="216" x2="230" y2="266" stroke="#4A5B73" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="312" x2="416" y2="312" stroke="#4A5B73" stroke-width="2" marker-end="url(#a)"/>
  <line x1="720" y1="312" x2="756" y2="312" stroke="#4A5B73" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1060" y1="312" x2="1096" y2="312" stroke="#4A5B73" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1310" y1="216" x2="1310" y2="266" stroke="#4A5B73" stroke-width="2" marker-end="url(#a)"/>

  <!-- Branch bar -->
  <path d="M1310 354 V384 H200 V414" fill="none" stroke="#4A5B73" stroke-width="2" marker-end="url(#a)"/>
  <path d="M600 384 V414" fill="none" stroke="#4A5B73" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1000 384 V414" fill="none" stroke="#4A5B73" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1310 384 H1360 V414" fill="none" stroke="#4A5B73" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1010 168 H1080 V398 H1450 V414" fill="none" stroke="#12A150" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#g)"/>

  <!-- Row 3: four jobs -->
  <g font-size="15">
    <rect x="40" y="418" width="320" height="300" rx="14" fill="#E6F6EC" stroke="#12A150"/>
    <text x="200" y="452" text-anchor="middle" font-size="19" font-weight="700" fill="#0B5A2C">Counter sale</text>
    <text x="64" y="486" fill="#0B1B33">• Bill made: 5 kg bag, ₹220</text>
    <text x="64" y="512" fill="#0B1B33">• Saathi: "cash, QR ya udhaar?"</text>
    <text x="64" y="538" fill="#0B1B33">• "kitne ka hua?" → total</text>
    <text x="64" y="564" fill="#0B1B33">• Cash → "saaman de sakte hain"</text>
    <text x="64" y="590" fill="#0B1B33">• Udhaar → written in khata</text>
    <text x="64" y="616" fill="#0B1B33">• QR payment → matched to bill</text>
    <text x="64" y="642" fill="#0B1B33">• Stock reduced, bill SB-0011</text>
    <text x="64" y="668" fill="#0B1B33">• Returns · "cancel karo" = undo</text>
    <text x="64" y="700" font-size="13" fill="#4A5B73">Small risk: recorded at once, undo 30 min</text>

    <rect x="440" y="418" width="320" height="300" rx="14" fill="#FFF4E0" stroke="#E08A00"/>
    <text x="600" y="452" text-anchor="middle" font-size="19" font-weight="700" fill="#7A4A00">Buying stock</text>
    <text x="464" y="486" fill="#0B1B33">• "Mujhe atta kharidna hai"</text>
    <text x="464" y="512" fill="#0B1B33">• Vendors compared on price</text>
    <text x="464" y="538" fill="#0B1B33">   and profit per bag</text>
    <text x="464" y="564" fill="#0B1B33">• Asks budget: "5–6 hazaar"</text>
    <text x="464" y="590" fill="#0B1B33">• Asks vendor: "Shree Chakki"</text>
    <text x="464" y="616" fill="#0B1B33">• Purchase plan drafted</text>
    <text x="464" y="642" fill="#0B1B33">• Also: restock within budget,</text>
    <text x="464" y="668" fill="#0B1B33">   festival stock, collect dues</text>
    <text x="464" y="700" font-size="13" fill="#7A4A00">Money moves → needs approval</text>

    <rect x="840" y="418" width="320" height="300" rx="14" fill="#E5F7FD" stroke="#00B9F1"/>
    <text x="1000" y="452" text-anchor="middle" font-size="19" font-weight="700" fill="#002E6E">Questions</text>
    <text x="864" y="486" fill="#0B1B33">• "Atta kitna bacha hai?"</text>
    <text x="864" y="512" fill="#0B1B33">• "Kahan stock kam hai?"</text>
    <text x="864" y="538" fill="#0B1B33">• "Kitna udhaar baaki hai?"</text>
    <text x="864" y="564" fill="#0B1B33">• "Loan kitna bacha hai?"</text>
    <text x="864" y="590" fill="#0B1B33">• Profit per item, daily brief</text>
    <text x="864" y="622" fill="#0B1B33">Common questions: plain code, ₹0</text>
    <text x="864" y="648" fill="#0B1B33">New questions: LLM with only</text>
    <text x="864" y="674" fill="#0B1B33">this shop's data</text>
    <text x="864" y="700" font-size="13" fill="#4A5B73">Numbers not in the records are rejected</text>

    <rect x="1240" y="418" width="320" height="300" rx="14" fill="#EFEDFD" stroke="#6B5CE7"/>
    <text x="1400" y="452" text-anchor="middle" font-size="19" font-weight="700" fill="#3C3489">Payments &amp; records</text>
    <text x="1264" y="486" fill="#0B1B33">• "Mukul ne 200 diye" → khata</text>
    <text x="1264" y="512" fill="#0B1B33">• QR payment announced:</text>
    <text x="1264" y="538" fill="#0B1B33">   "Garv ne paise bhej diye"</text>
    <text x="1264" y="564" fill="#0B1B33">• Supplier bill photo → stock</text>
    <text x="1264" y="590" fill="#0B1B33">   (Sarvam Document AI)</text>
    <text x="1264" y="616" fill="#0B1B33">• New item → add to inventory</text>
    <text x="1264" y="642" fill="#0B1B33">• Offers in 8+ languages</text>
    <text x="1264" y="668" fill="#0B1B33">   (Sarvam Mayura)</text>
    <text x="1264" y="700" font-size="13" fill="#4A5B73">Paytm links: verified webhook + status check</text>
  </g>

  <!-- Approval gate -->
  <line x1="600" y1="718" x2="600" y2="776" stroke="#E08A00" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="380" y="780" width="440" height="96" rx="14" fill="#FDECEC" stroke="#D93A3A" stroke-width="2"/>
  <text x="600" y="815" text-anchor="middle" font-size="19" font-weight="700" fill="#8A1F1F">Owner approves: tap + PIN / fingerprint</text>
  <text x="600" y="843" text-anchor="middle" font-size="15" fill="#0B1B33">On phone or dashboard. A spoken "approve" never approves.</text>
  <text x="600" y="864" text-anchor="middle" font-size="13" fill="#4A5B73">One-time approval tied to the exact order and amount</text>
  <line x1="820" y1="828" x2="900" y2="828" stroke="#12A150" stroke-width="2.5" marker-end="url(#g)"/>
  <rect x="904" y="790" width="340" height="76" rx="14" fill="#E6F6EC" stroke="#12A150"/>
  <text x="1074" y="822" text-anchor="middle" font-size="17" font-weight="700" fill="#0B5A2C">Order sent to supplier</text>
  <text x="1074" y="848" text-anchor="middle" font-size="14" fill="#0B1B33">Stock + cost price update on delivery</text>

  <!-- Bottom: shared data + outputs -->
  <path d="M200 718 V930" fill="none" stroke="#4A5B73" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1000 718 V760 H1500 V930" fill="none" stroke="#4A5B73" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1400 718 V740 H1540 V930" fill="none" stroke="#4A5B73" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1074 866 V930" fill="none" stroke="#4A5B73" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="934" width="1520" height="96" rx="14" fill="#002E6E"/>
  <text x="800" y="972" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">One shared record: PostgreSQL (Supabase) behind a FastAPI server</text>
  <text x="800" y="1004" text-anchor="middle" font-size="16" fill="#C9DDF5">Stock · bills · khata · invoices · payments · supplier orders · profit (FIFO cost) · loans · audit log of every step</text>

  <line x1="400" y1="1030" x2="400" y2="1066" stroke="#4A5B73" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1200" y1="1030" x2="1200" y2="1066" stroke="#4A5B73" stroke-width="2" marker-end="url(#a)"/>
  <rect x="80" y="1070" width="640" height="78" rx="14" fill="#E5F7FD" stroke="#00B9F1"/>
  <text x="400" y="1102" text-anchor="middle" font-size="18" font-weight="700" fill="#002E6E">Soundbox speaks the reply</text>
  <text x="400" y="1128" text-anchor="middle" font-size="15" fill="#0B1B33">Sarvam Bulbul v3 Hindi voice · ding + "Paytm par ₹220 prapt hue"</text>
  <rect x="880" y="1070" width="640" height="78" rx="14" fill="#E5F7FD" stroke="#00B9F1"/>
  <text x="1200" y="1102" text-anchor="middle" font-size="18" font-weight="700" fill="#002E6E">Everything updates live, within a second</text>
  <text x="1200" y="1128" text-anchor="middle" font-size="15" fill="#0B1B33">Phone app · web dashboard · iPad Soundbox (live feed)</text>
</svg>
